              'Households experiencing homelessness for the first time this reporting period',
              'Households that re-engaged in the homeless system after a previous temporary or unknown destination',
              'Households who re-engaged in the homeless system after a previous temporary or unknown destination',
              'Households that returned to homelessness this reporting period after a previous permanent housing placement',
              'Households who returned to homelessness this reporting period after a previous permanent housing placement'
            )
            AND project_type = CASE '{{ filters.household_type }}' WHEN 'All Household Types' THEN 'ALL' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' END
