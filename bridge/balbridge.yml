  - height: 360px
    tab: Length of Time
    widgets:
      - chart: line
        col: 12
        color:
          field: measure
        id: length_of_time_metrics
        name: Average days in the system over time
        sql: |
          SELECT
            FORMAT_DATE(
              '%Y Q%Q',
              DATE_ADD(DATE '1899-12-30', INTERVAL date DAY)
            ) AS period,
            CASE `set`
              WHEN 'Average length of time served in Emergency Shelters and Safe Havens (days)' THEN 'ES/SH Only'
              WHEN 'Average length of time served in Emergency Shelters, Safe Havens, and Transitional Housing (days)' THEN 'ES/SH + TH'
              ELSE 'ES/SH/TH + Days In Permanent Housing Search'
            END AS measure,
            value AS days
          FROM
            `baldashboard.performance_metrics`
          WHERE
            category LIKE 'Average Length of Time Homeless%'
            AND `set` IN (
              'Average length of time served in Emergency Shelters and Safe Havens (days)',
              'Average length of time served in Emergency Shelters, Safe Havens, and Transitional Housing (days)',
              'Average length of time homeless combining all ES, SH, TH, and "pre-housing" enrollments (days)'
            )
            AND project_type = CASE '{{ filters.household_type }}'
              WHEN 'All Household Types' THEN 'ALL'
              WHEN 'Adults Only' THEN 'AO'
              WHEN 'Families with Children' THEN 'AC'
              WHEN 'Unaccompanied Minors' THEN 'CO'
            END
          ORDER BY
            date,
            measure
        type: chart
        x:
          field: period
          title: Report quarter
          type: category
        y:
          field: days
          format: ".0f"
          title: Days
          type: number
  - height: 240px
    tab: Length of Time
    widgets:
      - col: 12
        columns:
          - label: Pathway
            name: measure
          - label: Report quarter
            name: report_period
            hidden: true
          - align: right
            label: Current days
            name: current_quarter_days
            number: number
          - align: right
            label: Prior-quarter days
            name: prior_quarter_days
            number: number
          - align: right
            label: Quarterly Change
            name: qoq_change
            number: ".1%"
        id: length_of_time_qoq
        name: Average days in the system — quarter-over-quarter detail
        sql: |
          WITH series AS (
            SELECT
              date,
              FORMAT_DATE('%Y Q%Q', DATE_ADD(DATE '1899-12-30', INTERVAL date DAY)) AS period,
              CASE `set`
                WHEN 'Average length of time served in Emergency Shelters and Safe Havens (days)' THEN 'ES/SH Only'
                WHEN 'Average length of time served in Emergency Shelters, Safe Havens, and Transitional Housing (days)' THEN 'ES/SH + TH'
                ELSE 'ES/SH/TH + Days In Permanent Housing Search'
              END AS measure,
              value AS days
            FROM `baldashboard.performance_metrics`
            WHERE category LIKE 'Average Length of Time Homeless%'
              AND `set` IN (
                'Average length of time served in Emergency Shelters and Safe Havens (days)',
                'Average length of time served in Emergency Shelters, Safe Havens, and Transitional Housing (days)',
                'Average length of time homeless combining all ES, SH, TH, and "pre-housing" enrollments (days)'
              )
              AND project_type = CASE '{{ filters.household_type }}'
                WHEN 'All Household Types' THEN 'ALL'
                WHEN 'Adults Only' THEN 'AO'
                WHEN 'Families with Children' THEN 'AC'
                WHEN 'Unaccompanied Minors' THEN 'CO'
              END
          ), qoq AS (
            SELECT *, LAG(days) OVER (PARTITION BY measure ORDER BY date) AS prior_quarter_days
            FROM series
          )
          SELECT
            measure,
            period AS report_period,
            days AS current_quarter_days,
            prior_quarter_days,
            SAFE_DIVIDE(days - prior_quarter_days, prior_quarter_days) AS qoq_change
          FROM qoq
          QUALIFY date = MAX(date) OVER ()
          ORDER BY measure
        type: table
  - height: 400px
    tab: System Engagement
    widgets:
      - chart: treemap
        col: 12
        id: engagement_household_treemap
        name: System engagement by household type
        slices:
          Adults Only — Established:
            color: "#1d4ed8"
          Adults Only — New:
            color: "#2563eb"
          Adults Only — Recurring:
            color: "#3b82f6"
          Adults Only — Returned:
            color: "#60a5fa"
          Families with Children — Established:
            color: "#15803d"
          Families with Children — New:
            color: "#16a34a"
          Families with Children — Recurring:
            color: "#22c55e"
          Families with Children — Returned:
            color: "#4ade80"
          Unaccompanied Minors — Established:
            color: "#7e22ce"
          Unaccompanied Minors — New:
            color: "#9333ea"
          Unaccompanied Minors — Recurring:
            color: "#a855f7"
          Unaccompanied Minors — Returned:
            color: "#c084fc"
        sql: |
          WITH source AS (
            SELECT
              date,
              CASE project_type WHEN 'AO' THEN 'Adults Only' WHEN 'AC' THEN 'Families with Children' WHEN 'CO' THEN 'Unaccompanied Minors' END AS household_type,
              CASE `set`
                WHEN 'Households who have been continuously homeless since a prior reporting period' THEN 'Established'
                WHEN 'Households experiencing homelessness for the first time this reporting period' THEN 'New'
                WHEN 'Households who re-engaged in the homeless system after a previous temporary or unknown destination' THEN 'Recurring'
                ELSE 'Returned'
              END AS engagement_state,
              MAX(value) AS households
            FROM `baldashboard.performance_metrics`
            WHERE population_group = 'System Use'
              AND category LIKE 'System Engagement History%'
              AND `set` IN (
                'Households who have been continuously homeless since a prior reporting period',
                'Households experiencing homelessness for the first time this reporting period',
                'Households who re-engaged in the homeless system after a previous temporary or unknown destination',
                'Households who returned to homelessness this reporting period after a previous permanent housing placement'
              )
              AND project_type IN ('AO', 'AC', 'CO')
              AND ('{{ filters.household_type }}' = 'All Household Types' OR project_type = CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' END)
            GROUP BY 1, 2, 3
          ), ranked AS (
            SELECT *, DENSE_RANK() OVER (ORDER BY date DESC) AS period_rank
            FROM source
          ), current_values AS (
            SELECT
              household_type,
              engagement_state,
              MAX(IF(period_rank = 1, households, NULL)) AS households,
              MAX(IF(period_rank = 2, households, NULL)) AS previous_quarter_households
            FROM ranked
            WHERE period_rank <= 2
            GROUP BY 1, 2
          )
          SELECT
            CONCAT(household_type, ' — ', engagement_state) AS segment,
            household_type,
            engagement_state,
            households,
            previous_quarter_households,
            CASE
              WHEN previous_quarter_households = 0 THEN 'N/A — prior quarter was zero'
              WHEN previous_quarter_households IS NULL THEN 'N/A — no prior quarter'
              ELSE FORMAT('%+.1f%%', 100 * SAFE_DIVIDE(households - previous_quarter_households, previous_quarter_households))
            END AS qoq_change,
            SUM(households) OVER (PARTITION BY household_type) AS household_type_total,
            FORMAT('%.1f%%', 100 * SAFE_DIVIDE(households, SUM(households) OVER (PARTITION BY household_type))) AS share_within_household_type,
            FORMAT('%.1f%%', 100 * SAFE_DIVIDE(households, SUM(households) OVER ())) AS share_of_all_households,
            FORMAT_DATE('%Y Q%Q', DATE_ADD(DATE '1899-12-30', INTERVAL (SELECT MAX(date) FROM `baldashboard.performance_metrics`) DAY)) AS report_period
          FROM current_values
          ORDER BY households DESC
        type: chart
        label: segment
        value:
          field: households
          format: ",.0f"
  - height: 360px
    tab: System Engagement
    widgets:
      - col: 12
        columns:
          - label: Household type
            name: household_type
          - label: Engagement state
            name: engagement_state
          - align: right
            label: Current households
            name: current_households
            number: number
          - align: right
            label: Prior-quarter households
            name: prior_quarter_households
            number: number
          - align: right
            label: Quarterly Change
            name: qoq_change
        id: engagement_household_qoq_detail
        name: Household engagement — quarter-over-quarter detail
        sql: |
          WITH source AS (
            SELECT
              date,
              CASE project_type WHEN 'AO' THEN 'Adults Only' WHEN 'AC' THEN 'Families with Children' WHEN 'CO' THEN 'Unaccompanied Minors' END AS household_type,
              CASE `set`
                WHEN 'Households who have been continuously homeless since a prior reporting period' THEN 'Established'
                WHEN 'Households experiencing homelessness for the first time this reporting period' THEN 'New'
                WHEN 'Households who re-engaged in the homeless system after a previous temporary or unknown destination' THEN 'Recurring'
                ELSE 'Returned'
              END AS engagement_state,
              MAX(value) AS households
            FROM `baldashboard.performance_metrics`
            WHERE population_group = 'System Use'
              AND category LIKE 'System Engagement History%'
              AND `set` IN (
                'Households who have been continuously homeless since a prior reporting period',
                'Households experiencing homelessness for the first time this reporting period',
                'Households who re-engaged in the homeless system after a previous temporary or unknown destination',
                'Households who returned to homelessness this reporting period after a previous permanent housing placement'
              )
              AND project_type IN ('AO', 'AC', 'CO')
              AND ('{{ filters.household_type }}' = 'All Household Types' OR project_type = CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' END)
            GROUP BY 1, 2, 3
          ), ranked AS (
            SELECT *, DENSE_RANK() OVER (ORDER BY date DESC) AS period_rank
            FROM source
          ), current_values AS (
            SELECT
              household_type,
              engagement_state,
              MAX(IF(period_rank = 1, households, NULL)) AS current_households,
              MAX(IF(period_rank = 2, households, NULL)) AS prior_quarter_households
            FROM ranked
            WHERE period_rank <= 2
            GROUP BY 1, 2
          ), detail_rows AS (
            SELECT
              household_type,
              engagement_state,
              current_households,
              prior_quarter_households,
              CASE
                WHEN prior_quarter_households = 0 THEN 'N/A — prior quarter was zero'
                WHEN prior_quarter_households IS NULL THEN 'N/A — no prior quarter'
                ELSE FORMAT('%+.1f%%', 100 * SAFE_DIVIDE(current_households - prior_quarter_households, prior_quarter_households))
              END AS qoq_change,
              1 AS total_sort,
              CASE engagement_state WHEN 'Established' THEN 1 WHEN 'New' THEN 2 WHEN 'Recurring' THEN 3 ELSE 4 END AS state_sort
            FROM current_values
          ), output_rows AS (
            SELECT * FROM detail_rows
            UNION ALL
            SELECT
              'Grand total' AS household_type,
              'All engagement states' AS engagement_state,
              SUM(current_households) AS current_households,
              SUM(prior_quarter_households) AS prior_quarter_households,
              CASE
                WHEN SUM(prior_quarter_households) = 0 THEN 'N/A — prior quarter was zero'
                ELSE FORMAT('%+.1f%%', 100 * SAFE_DIVIDE(SUM(current_households) - SUM(prior_quarter_households), SUM(prior_quarter_households)))
              END AS qoq_change,
              2 AS total_sort,
              5 AS state_sort
            FROM detail_rows
          )
          SELECT household_type, engagement_state, current_households, prior_quarter_households, qoq_change
          FROM output_rows
          ORDER BY total_sort, household_type, state_sort
        type: table
