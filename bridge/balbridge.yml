# Verbatim copy of balbridge.yml (Bridge to Housing Dashboard) from the private
# hmisguru/baltimore repo, staging branch. The Observable prototype at /bridge/
# renders these widgets and runs their SQL at build time; refresh it with:
#   git -C ../baltimore show origin/staging:balbridge.yml > /tmp/b.yml
#   (keep this header) and replace everything below it.
connection: bigquery
filters:
  - default: All Household Types
    name: household_type
    type: select
    options:
      values: [All Household Types, Adults Only, Families with Children, Unaccompanied Minors]
  - default: All Project Types
    name: project_type
    type: select
    options:
      values: [All Project Types, ES/SH/TH, RRH]
name: Bridge to Housing Dashboard
description: Data on interim housing and the journey toward permanent stability.
rows:
  - widgets:
      - name: Dashboard Notes
        type: text
        content: |
          This dashboard analyzes how people enter and flow through "interim housing" on their journey to stable, permanent housing. This dashboard DOES NOT include people in non-HMIS participating projects like Domestic Violence shelters.

          ### Interim Housing

          Interim Housing is comprised of short-term Emergency Shelter and Safe Haven as well as medium-term Transitional Housing and time-limited subsidies known as Rapid Re-housing.

          ### Household Types

          Adults Only are households with no children present. Families with Children have at least one adult and one child. Unaccompanied Minors are households of children under 18 with no adult present.
        col: 12
  - tab: Overview
    widgets:
      - col: 12
        id: current_quarter_range
        name: Current Quarter
        sql: |
          WITH latest AS (
            SELECT DATE_ADD(DATE '1899-12-30', INTERVAL MAX(date) DAY) AS report_date
            FROM `baldashboard.performance_metrics`
          )
          SELECT
            CONCAT(
              FORMAT_DATE('%-m/%-d/%Y', DATE_TRUNC(report_date, QUARTER)),
              ' - ',
              FORMAT_DATE('%-m/%-d/%Y', DATE_SUB(DATE_ADD(DATE_TRUNC(report_date, QUARTER), INTERVAL 3 MONTH), INTERVAL 1 DAY))
            ) AS quarter_range
          FROM latest
        type: metric
        value:
          field: quarter_range
  - tab: Overview
    widgets:
      - col: 6
        id: people_served_total
        name: People Served in Interim Housing
        sql: "SELECT SUM(value) AS value FROM `baldashboard.performance_metrics` WHERE category = 'Summary' AND `set` = 'Total Number of People Served' AND (CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END = 'ALL' OR population_group = CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END) AND date = (SELECT MAX(date) FROM `baldashboard.performance_metrics`) AND (CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END = 'ALL' OR project_type = CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END) AND project_type != 'PSH'"
        type: metric
        value:
          field: value
          format: ",.0f"
          type: number
      - col: 6
        id: households_served_total
        name: Households Served in Interim Housing
        sql: "SELECT SUM(value) AS value FROM `baldashboard.performance_metrics` WHERE category = 'Summary' AND `set` = 'Total Number of Households Served' AND (CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END = 'ALL' OR population_group = CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END) AND date = (SELECT MAX(date) FROM `baldashboard.performance_metrics`) AND (CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END = 'ALL' OR project_type = CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END) AND project_type != 'PSH'"
        type: metric
        value:
          field: value
          format: ",.0f"
          type: number
  - tab: Overview
    widgets:
      - col: 6
        id: people_served_qoq
        name: Quarterly Change — Persons Served
        sql: |
          WITH scoped AS (
            SELECT date, SUM(value) AS value
            FROM `baldashboard.performance_metrics`
            WHERE category = 'Summary'
              AND `set` = 'Total Number of People Served'
              AND (CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END = 'ALL' OR population_group = CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END)
              AND (CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END = 'ALL' OR project_type = CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END)
              AND project_type != 'PSH'
            GROUP BY 1
          ), ranked AS (
            SELECT value, DENSE_RANK() OVER (ORDER BY date DESC) AS period_rank
            FROM scoped
          )
          SELECT SAFE_DIVIDE(MAX(IF(period_rank = 1, value, NULL)) - MAX(IF(period_rank = 2, value, NULL)), MAX(IF(period_rank = 2, value, NULL))) AS value
          FROM ranked
          WHERE period_rank <= 2
        type: metric
        value:
          field: value
          format: ".1%"
          type: number
      - col: 6
        id: households_served_qoq
        name: Quarterly Change — Households Served
        sql: |
          WITH scoped AS (
            SELECT date, SUM(value) AS value
            FROM `baldashboard.performance_metrics`
            WHERE category = 'Summary'
              AND `set` = 'Total Number of Households Served'
              AND (CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END = 'ALL' OR population_group = CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END)
              AND (CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END = 'ALL' OR project_type = CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END)
              AND project_type != 'PSH'
            GROUP BY 1
          ), ranked AS (
            SELECT value, DENSE_RANK() OVER (ORDER BY date DESC) AS period_rank
            FROM scoped
          )
          SELECT SAFE_DIVIDE(MAX(IF(period_rank = 1, value, NULL)) - MAX(IF(period_rank = 2, value, NULL)), MAX(IF(period_rank = 2, value, NULL))) AS value
          FROM ranked
          WHERE period_rank <= 2
        type: metric
        value:
          field: value
          format: ".1%"
          type: number
  - height: 500px
    tab: Overview
    widgets:
      - chart: line
        col: 6
        color:
          field: project_type
        id: people_served_trend
        name: People served by program type over time
        sql: |
          SELECT
            FORMAT_DATE('%Y Q%Q', DATE_ADD(DATE '1899-12-30', INTERVAL date DAY)) AS report_period,
            CASE WHEN project_type = 'ES,SH,TH' THEN 'ES/SH/TH' ELSE project_type END AS project_type,
            SUM(value) AS served
          FROM `baldashboard.performance_metrics`
          WHERE category = 'Summary'
            AND `set` = 'Total Number of People Served'
            AND project_type IN ('ES,SH,TH', 'RRH')
            AND (CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END = 'ALL' OR population_group = CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END)
            AND (CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END = 'ALL' OR project_type = CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END)
          GROUP BY 1, 2
          ORDER BY 1, 2
        type: chart
        x:
          field: report_period
          title: Report quarter
          type: category
        y:
          field: served
          format: ",.0f"
          title: People served
          type: number
      - chart: line
        col: 6
        color:
          field: project_type
        id: households_served_trend
        name: Households served by program type over time
        sql: |
          SELECT
            FORMAT_DATE('%Y Q%Q', DATE_ADD(DATE '1899-12-30', INTERVAL date DAY)) AS report_period,
            CASE WHEN project_type = 'ES,SH,TH' THEN 'ES/SH/TH' ELSE project_type END AS project_type,
            SUM(value) AS served
          FROM `baldashboard.performance_metrics`
          WHERE category = 'Summary'
            AND `set` = 'Total Number of Households Served'
            AND project_type IN ('ES,SH,TH', 'RRH')
            AND (CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END = 'ALL' OR population_group = CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END)
            AND (CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END = 'ALL' OR project_type = CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END)
          GROUP BY 1, 2
          ORDER BY 1, 2
        type: chart
        x:
          field: report_period
          title: Report quarter
          type: category
        y:
          field: served
          format: ",.0f"
          title: Households served
          type: number
  - height: 400px
    tab: Overview
    widgets:
      - chart: bar
        col: 12
        color:
          field: living_situation
        id: prior_living_situation_by_project_type
        name: Prior Living Situation by Project Type
        stacked: true
        sql: |
          SELECT
            CASE WHEN project_type = 'ES,SH,TH' THEN 'ES/SH/TH' ELSE project_type END AS project_type,
            CASE
              WHEN `set` = 'Homeless - Street' THEN 'Street'
              WHEN STARTS_WITH(LOWER(`set`), 'homeless') THEN 'Emergency Shelter / Housing'
              WHEN STARTS_WITH(LOWER(`set`), 'permanent') THEN 'Permanent Setting'
              WHEN STARTS_WITH(LOWER(`set`), 'institutions') THEN 'Institutional Setting'
              WHEN `set` = 'Staying with family or friends' THEN 'Family or Friends'
              ELSE 'Other'
            END AS living_situation,
            SUM(value) AS people_served
          FROM `baldashboard.performance_metrics`
          WHERE category = 'Prior Living Situation'
            AND project_type IN ('ES,SH,TH', 'RRH')
            AND date = (SELECT MAX(date) FROM `baldashboard.performance_metrics`)
            AND (CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END = 'ALL' OR population_group = CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END)
            AND (CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END = 'ALL' OR project_type = CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END)
          GROUP BY 1, 2
          ORDER BY 1, 2
        type: chart
        x:
          field: project_type
          title: Project type
          type: category
        y:
          field: people_served
          format: ",.0f"
          title: People served
          type: number
  - tab: Demographics
    widgets:
      - col: 12
        id: current_quarter_range_demographics
        name: Current Quarter
        sql: |
          WITH latest AS (
            SELECT DATE_ADD(DATE '1899-12-30', INTERVAL MAX(date) DAY) AS report_date
            FROM `baldashboard.performance_metrics`
          )
          SELECT
            CONCAT(
              FORMAT_DATE('%-m/%-d/%Y', DATE_TRUNC(report_date, QUARTER)),
              ' - ',
              FORMAT_DATE('%-m/%-d/%Y', DATE_SUB(DATE_ADD(DATE_TRUNC(report_date, QUARTER), INTERVAL 3 MONTH), INTERVAL 1 DAY))
            ) AS quarter_range
          FROM latest
        type: metric
        value:
          field: quarter_range
  - tab: Demographics
    widgets:
      - col: 6
        id: people_served_total_demographics
        name: People Served in Interim Housing
        sql: "SELECT SUM(value) AS value FROM `baldashboard.performance_metrics` WHERE category = 'Summary' AND `set` = 'Total Number of People Served' AND (CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END = 'ALL' OR population_group = CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END) AND date = (SELECT MAX(date) FROM `baldashboard.performance_metrics`) AND (CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END = 'ALL' OR project_type = CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END) AND project_type != 'PSH'"
        type: metric
        value:
          field: value
          format: ",.0f"
          type: number
      - col: 6
        id: households_served_total_demographics
        name: Households Served in Interim Housing
        sql: "SELECT SUM(value) AS value FROM `baldashboard.performance_metrics` WHERE category = 'Summary' AND `set` = 'Total Number of Households Served' AND (CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END = 'ALL' OR population_group = CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END) AND date = (SELECT MAX(date) FROM `baldashboard.performance_metrics`) AND (CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END = 'ALL' OR project_type = CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END) AND project_type != 'PSH'"
        type: metric
        value:
          field: value
          format: ",.0f"
          type: number
  - tab: Demographics
    widgets:
      - col: 12
        columns:
          - label: Indicator
            name: indicator
          - align: right
            label: Current Quarter
            name: current_value
            number: number
          - align: right
            label: Previous Quarter
            name: previous_value
            number: number
          - align: right
            label: Quarterly Change
            name: qoq_change
            number: ".1%"
        id: priority_households
        name: Priority Households
        sql: |
          WITH scoped AS (
            SELECT
              date,
              CASE `set` WHEN 'Total Number of Disabled Households' THEN 'Disabled households' WHEN 'Total Number of 55+ Households' THEN 'Age 55+ Households' WHEN 'Total Number of Veteran Households' THEN 'Veteran households' END AS indicator,
              SUM(value) AS value
            FROM `baldashboard.performance_metrics`
            WHERE category = 'Summary'
              AND `set` IN ('Total Number of Disabled Households', 'Total Number of 55+ Households', 'Total Number of Veteran Households')
              AND (CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END = 'ALL' OR population_group = CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END)
              AND (CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END = 'ALL' OR project_type = CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END)
              AND project_type != 'PSH'
            GROUP BY 1, 2
          ), ranked AS (
            SELECT date, DENSE_RANK() OVER (ORDER BY date DESC) AS period_rank
            FROM (SELECT DISTINCT date FROM scoped)
          )
          SELECT
            indicator,
            MAX(IF(period_rank = 1, value, NULL)) AS current_value,
            MAX(IF(period_rank = 2, value, NULL)) AS previous_value,
            SAFE_DIVIDE(MAX(IF(period_rank = 1, value, NULL)) - MAX(IF(period_rank = 2, value, NULL)), MAX(IF(period_rank = 2, value, NULL))) AS qoq_change
          FROM scoped
          JOIN ranked USING (date)
          WHERE period_rank <= 2
          GROUP BY indicator
          ORDER BY indicator
        type: table
  - height: 450px
    tab: Demographics
    widgets:
      - chart: pie
        col: 6
        id: race_pie
        name: Race of People Served — Current Quarter
        sql: |
          WITH mapped AS (
            SELECT
              CASE REGEXP_REPLACE(`set`, r', (non-)?Hispanic/Latina/o (\(single race selected\)|also selected|not selected)$', '')
                WHEN 'American Indian, Alaska Native or Indigenous' THEN 'AI/AN or Indigenous'
                WHEN 'Asian or Asian American' THEN 'Asian'
                WHEN 'Black or African-American' THEN 'Black/African-American'
                WHEN 'Middle Eastern or North African' THEN 'MENA'
                WHEN 'Multiple Race selections: any two or more races selected' THEN 'Multiple Races'
                WHEN 'Native Hawaiian or Pacific Islander' THEN 'NH/Pacific Islander'
                ELSE 'White'
              END AS race,
              SUM(value) AS people_served
            FROM `baldashboard.performance_metrics`
            WHERE category = 'Race and Ethnicity'
              AND `set` NOT IN ('Race: Not provided/missing/invalid responses', 'Hispanic/Latina/o (no other category selected)')
              AND project_type IN ('ES,SH,TH', 'RRH')
              AND date = (SELECT MAX(date) FROM `baldashboard.performance_metrics`)
              AND (CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END = 'ALL' OR population_group = CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END)
              AND (CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END = 'ALL' OR project_type = CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END)
            GROUP BY 1
          ), totaled AS (
            SELECT race, people_served, SUM(people_served) OVER () AS grand_total
            FROM mapped
          )
          SELECT
            CASE WHEN SAFE_DIVIDE(people_served, grand_total) < 0.03 THEN 'Other' ELSE race END AS race,
            SUM(people_served) AS people_served
          FROM totaled
          GROUP BY 1
          ORDER BY 2 DESC
        type: chart
        label: race
        value:
          field: people_served
          format: ",.0f"
      - chart: pie
        col: 6
        id: ethnicity_pie
        name: Ethnicity of People Served — Current Quarter
        sql: |
          SELECT
            CASE
              WHEN `set` LIKE '%non-Hispanic/Latina/o (single race selected)' THEN 'Non-Hispanic'
              WHEN `set` LIKE '%Hispanic/Latina/o not selected' THEN 'Non-Hispanic'
              WHEN `set` = 'Hispanic/Latina/o (no other category selected)' THEN 'Hispanic'
              WHEN `set` LIKE '%Hispanic/Latina/o (single race selected)' THEN 'Hispanic'
              WHEN `set` LIKE '%Hispanic/Latina/o also selected' THEN 'Hispanic'
              ELSE 'Non-Hispanic'
            END AS ethnicity,
            SUM(value) AS people_served
          FROM `baldashboard.performance_metrics`
          WHERE category = 'Race and Ethnicity'
            AND `set` != 'Race: Not provided/missing/invalid responses'
            AND project_type IN ('ES,SH,TH', 'RRH')
            AND date = (SELECT MAX(date) FROM `baldashboard.performance_metrics`)
            AND (CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END = 'ALL' OR population_group = CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END)
            AND (CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END = 'ALL' OR project_type = CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END)
          GROUP BY 1
          ORDER BY 1
        type: chart
        label: ethnicity
        value:
          field: people_served
          format: ",.0f"
  - height: 400px
    tab: Demographics
    widgets:
      - col: 12
        columns:
          - label: Indicator
            name: indicator
          - align: right
            label: Current Quarter
            name: current_value
            number: number
          - align: right
            label: Previous Quarter
            name: previous_value
            number: number
          - align: right
            label: Quarterly Change
            name: qoq_change
            number: ".1%"
        id: race_ethnicity_qoq
        name: Race of People Served
        sql: |
          WITH scoped AS (
            SELECT
              date,
              REGEXP_REPLACE(`set`, r', (non-)?Hispanic/Latina/o (\(single race selected\)|also selected|not selected)$', '') AS indicator,
              SUM(value) AS value
            FROM `baldashboard.performance_metrics`
            WHERE category = 'Race and Ethnicity'
              AND `set` NOT IN ('Race: Not provided/missing/invalid responses', 'Hispanic/Latina/o (no other category selected)')
              AND project_type IN ('ES,SH,TH', 'RRH')
              AND (CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END = 'ALL' OR population_group = CASE '{{ filters.household_type }}' WHEN 'Adults Only' THEN 'AO' WHEN 'Families with Children' THEN 'AC' WHEN 'Unaccompanied Minors' THEN 'CO' ELSE 'ALL' END)
              AND (CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END = 'ALL' OR project_type = CASE '{{ filters.project_type }}' WHEN 'ES/SH/TH' THEN 'ES,SH,TH' WHEN 'RRH' THEN 'RRH' ELSE 'ALL' END)
            GROUP BY 1, 2
          ), ranked AS (
            SELECT date, DENSE_RANK() OVER (ORDER BY date DESC) AS period_rank
            FROM (SELECT DISTINCT date FROM scoped)
          )
          SELECT
            indicator,
            MAX(IF(period_rank = 1, value, NULL)) AS current_value,
            MAX(IF(period_rank = 2, value, NULL)) AS previous_value,
            SAFE_DIVIDE(MAX(IF(period_rank = 1, value, NULL)) - MAX(IF(period_rank = 2, value, NULL)), MAX(IF(period_rank = 2, value, NULL))) AS qoq_change
          FROM scoped
          JOIN ranked USING (date)
          WHERE period_rank <= 2
          GROUP BY indicator
          ORDER BY indicator
        type: table
  - height: 260px
    tab: Demographics
    widgets:
      - col: 12
        columns:
          - label: Indicator
            name: indicator
          - align: right
            label: Current Quarter
            name: current_value
            number: number
          - align: right
            label: Previous Quarter
            name: previous_value
            number: number
          - align: right
            label: Quarterly Change
            name: qoq_change
            number: ".1%"
        id: ethnicity_qoq
        name: Ethnicity of People Served
        sql: |
          WITH scoped AS (
            SELECT
              date,
              CASE
                WHEN `set` LIKE '%non-Hispanic/Latina/o (single race selected)' THEN 'Non-Hispanic'
                WHEN `set` LIKE '%Hispanic/Latina/o not selected' THEN 'Non-Hispanic'
                WHEN `set` = 'Hispanic/Latina/o (no other category selected)' THEN 'Hispanic'
                WHEN `set` LIKE '%Hispanic/Latina/o (single race selected)' THEN 'Hispanic'
                WHEN `set` LIKE '%Hispanic/Latina/o also selected' THEN 'Hispanic'
                ELSE 'Non-Hispanic'
              END AS indicator,
              SUM(value) AS value
            FROM `baldashboard.performance_metrics`
            WHERE category = 'Race and Ethnicity'
