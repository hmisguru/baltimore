              - { if: greater_than_or_equal, value: 1, backgroundColor: green, textColor: white, bold: true }
              - { backgroundColor: red, textColor: white }
          - label: Comparison
            name: comparison_label
          - align: right
            label: 4-Quarter Average
            name: rolling_avg_4q
            number: number
        id: permanent_destination_exits_gauge_context
        name: Exits to Permanent Housing — Trend
        sql: |
          WITH scoped AS (
            SELECT
              date,
              SUM(value) AS value
            FROM `baldashboard.performance_metrics`
            WHERE category = 'Summary Exit Outcomes for Households Served in Temporary Situations during the Report Period'
              AND `set` = 'Households with a system exit to any permanent housing destination'
              AND project_type IN ('AO', 'AC', 'CO')
              AND ('{{ filters.household_type }}' = 'All Household Types' OR project_type = CASE '{{ filters.household_type }}'
                WHEN 'Adults Only' THEN 'AO'
                WHEN 'Families with Children' THEN 'AC'
                WHEN 'Unaccompanied Minors' THEN 'CO'
              END)
            GROUP BY 1
          ), ranked AS (
            SELECT date, value, DENSE_RANK() OVER (ORDER BY date DESC) AS period_rank
            FROM scoped
          )
          SELECT
            'Households exiting to permanent housing' AS indicator,
            MAX(IF(period_rank = 1, value, NULL)) AS current_value,
            AVG(IF(period_rank BETWEEN 2 AND 5, value, NULL)) AS rolling_avg_4q,
            SAFE_DIVIDE(MAX(IF(period_rank = 1, value, NULL)), AVG(IF(period_rank BETWEEN 2 AND 5, value, NULL))) AS pct_of_average,
            CASE WHEN SAFE_DIVIDE(MAX(IF(period_rank = 1, value, NULL)), AVG(IF(period_rank BETWEEN 2 AND 5, value, NULL))) >= 1 THEN 'above average' ELSE 'below average' END AS comparison_label
          FROM ranked
