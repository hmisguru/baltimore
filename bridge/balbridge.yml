            number: number
          - align: right
            label: Prior-quarter exits
            name: prior_quarter_exits
            number: number
          - align: right
            label: Quarterly Change
            name: qoq_change
            number: ".1%"
        id: permanent_destination_exits_qoq
        name: Exits to Permanent Destinations by Household Type
        sql: |
          WITH series AS (
            SELECT
              date,
              FORMAT_DATE('%Y Q%Q', DATE_ADD(DATE '1899-12-30', INTERVAL date DAY)) AS period,
              CASE project_type
                WHEN 'AO' THEN 'Adults Only'
                WHEN 'AC' THEN 'Families with Children'
                WHEN 'CO' THEN 'Unaccompanied Minors'
              END AS household_type,
              value AS households
            FROM `baldashboard.performance_metrics`
            WHERE category = 'Summary Exit Outcomes for Households Served in Temporary Situations during the Report Period'
              AND `set` = 'Households with a system exit to any permanent housing destination'
              AND project_type IN ('AO', 'AC', 'CO')
              AND ('{{ filters.household_type }}' = 'All Household Types' OR project_type = CASE '{{ filters.household_type }}'
                WHEN 'Adults Only' THEN 'AO'
                WHEN 'Families with Children' THEN 'AC'
                WHEN 'Unaccompanied Minors' THEN 'CO'
              END)
          ), qoq AS (
            SELECT *, LAG(households) OVER (PARTITION BY household_type ORDER BY date) AS prior_quarter_exits
            FROM series
          ), latest AS (
            SELECT
              household_type,
              period AS report_period,
              households AS current_quarter_exits,
              prior_quarter_exits,
              SAFE_DIVIDE(households - prior_quarter_exits, prior_quarter_exits) AS qoq_change
            FROM qoq
            QUALIFY date = MAX(date) OVER ()
          )
          SELECT * EXCEPT(sort_order)
          FROM (
            SELECT household_type, report_period, current_quarter_exits, prior_quarter_exits, qoq_change, 1 AS sort_order
            FROM latest
            UNION ALL
            SELECT
              'Grand Total' AS household_type,
              MAX(report_period) AS report_period,
              SUM(current_quarter_exits) AS current_quarter_exits,
              SUM(prior_quarter_exits) AS prior_quarter_exits,
              SAFE_DIVIDE(SUM(current_quarter_exits) - SUM(prior_quarter_exits), SUM(prior_quarter_exits)) AS qoq_change,
              2 AS sort_order
            FROM latest
          )
          ORDER BY sort_order, household_type
        type: table
